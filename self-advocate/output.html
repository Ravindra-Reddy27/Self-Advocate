<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Output</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
            padding-top: 5rem;
            color: #e0e0e0;
        }
    </style>
</head>
<body class="relative">
    <!-- Previous Button at Top Right -->
    <button id="previousButton" class="absolute top-4 right-4 bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out text-sm md:text-base">
        Previous
    </button>

    <!-- Main Content Container -->
    <div class="bg-gray-900 p-6 md:p-8 rounded-xl shadow-lg max-w-2xl w-full mx-auto flex flex-col items-center mb-8 text-white">
        <!-- Media Displayer -->
        <div id="media-displayer" class="bg-gray-800 p-6 rounded-lg w-full text-gray-200 text-center text-lg md:text-xl leading-relaxed mb-8 border border-gray-700 min-h-[200px] flex items-center justify-center">
            <!-- Uploaded content will be displayed here by JavaScript -->
            <p>Loading uploaded file...</p>
        </div>

        <!-- Action Buttons Container -->
        <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 w-full justify-center">
             <button id="notCorrectButton" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out text-sm md:text-base w-full sm:w-auto focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-opacity-75">
                Upload another file
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get references to buttons
            const previousButton = document.getElementById('previousButton');
            const notCorrectButton = document.getElementById('notCorrectButton');
            const mediaDisplayer = document.getElementById('media-displayer');

            // --- Event Listeners for Buttons ---
            previousButton.addEventListener('click', () => {
                window.location.href = 'index.html'; // Redirect to the main page
            });

            notCorrectButton.addEventListener('click', () => {
                window.location.href = 'index.html'; // Redirect to the main page to try again
            });

            // --- Logic to Display Uploaded File ---
            const params = new URLSearchParams(window.location.search);
            const fileUrl = params.get('fileUrl');

            if (fileUrl) {
                // Clear the 'Loading...' text
                mediaDisplayer.innerHTML = '';
                let mediaElement;
                const decodedUrl = decodeURIComponent(fileUrl);

                // Determine file type based on extension
                if (decodedUrl.match(/\.(jpeg|jpg|gif|png|svg)$/i)) {
                    mediaElement = document.createElement('img');
                    mediaElement.src = decodedUrl;
                    mediaElement.alt = 'Uploaded Image';
                    mediaElement.className = 'max-w-full h-auto rounded-lg mx-auto';
                } else if (decodedUrl.match(/\.(mp4|webm|mov|ogg)$/i)) {
                    mediaElement = document.createElement('video');
                    mediaElement.src = decodedUrl;
                    mediaElement.controls = true;
                    mediaElement.autoplay = true;
                    mediaElement.className = 'max-w-full rounded-lg mx-auto';
                } else if (decodedUrl.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                    mediaElement = document.createElement('audio');
                    mediaElement.src = decodedUrl;
                    mediaElement.controls = true;
                    mediaElement.autoplay = true;
                    mediaElement.className = 'w-full';
                } else {
                    // Fallback for unsupported files or links
                    mediaDisplayer.innerHTML = `<p class="text-red-400">Unsupported file type.</p><a href="${decodedUrl}" target="_blank" class="text-blue-400 hover:underline">View file</a>`;
                    return;
                }

                // Add the created media element to the displayer div
                mediaDisplayer.appendChild(mediaElement);

            } else {
                // Handle case where no fileUrl is in the query string
                mediaDisplayer.innerHTML = '<p class="text-red-400">No file was specified in the URL.</p>';
            }
        });
    </script>
</body>
</html>
